name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        skill:
          - altium-library-migrate
          - altium-365-library-maintain
          - altium-design-review
          - digikey-part-selection
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install binary engine for migration tests
        if: matrix.skill == 'altium-library-migrate'
        run: python -m pip install -r altium-library-migrate/scripts/requirements.txt
      - name: Run offline suite
        run: python -B -m unittest discover -s "${{ matrix.skill }}/tests" -v
