name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
            skill: digikey-part-selection
          - os: windows-latest
            python: '3.12'
            skill: part-sourcing
          - os: windows-latest
            python: '3.12'
            skill: st-origin-lookup
          - os: ubuntu-latest
            python: '3.10'
            skill: digikey-part-selection
          - os: ubuntu-latest
            python: '3.10'
            skill: part-sourcing
          - os: ubuntu-latest
            python: '3.10'
            skill: st-origin-lookup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline suite
        if: matrix.skill != 'st-origin-lookup'
        run: python -B -m unittest discover -s "${{ matrix.skill }}/tests" -v
      - name: Run ST origin offline suite
        if: matrix.skill == 'st-origin-lookup'
        run: python -B st-origin-lookup/scripts/test_st_origin_lookup.py

  review-integrations:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r hardware-design-review/scripts/requirements-cam.txt
      - run: python -B -m unittest discover -s hardware-design-review/tests -v
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: hardware-design-review
      - run: npm test
        working-directory: hardware-design-review
